<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador de Actas — Ciberseguridad FCV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6F4;
    --surface: #FFFFFF;
    --ink: #16242A;
    --muted: #5B6B70;
    --accent: #1F6F6B;
    --accent-soft: #E4F0EF;
    --border: #DCE3E2;
    --flag: #9C6B2E;
    --flag-soft: #F5EBDC;
  }
  * { box-sizing: border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width: 920px; margin: 0 auto; padding: 48px 24px 80px; }
 
  header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:36px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand svg{ flex-shrink:0; }
  .brand-text{ font-size:14px; color:var(--muted); font-weight:500; }
  .brand-text strong{ color:var(--ink); }
 
  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:34px;
    line-height:1.15;
    margin:0 0 28px;
    letter-spacing:-0.01em;
  }
 
  .search-zone{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:20px;
    box-shadow: 0 1px 2px rgba(22,36,42,0.04);
    animation: rise 0.5s ease-out;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
 
  .search-input-row{ position:relative; }
  .search-input-row svg{ position:absolute; left:14px; top:50%; transform:translateY(-50%); }
  input[type="text"]{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:17px;
    padding:14px 14px 14px 44px;
    border:1px solid var(--border);
    border-radius:10px;
    outline:none;
    background:var(--bg);
    color:var(--ink);
  }
  input[type="text"]:focus{ border-color: var(--accent); background: var(--surface); }
  input[type="text"]::placeholder{ color:#8A9A9E; }
 
  .filter-row{ display:flex; gap:10px; margin-top:12px; align-items:center; }
  select{
    font-family:'Inter', sans-serif;
    font-size:14px;
    padding:9px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    color:var(--ink);
    cursor:pointer;
  }
  .reset-btn{
    font-family:'Inter', sans-serif;
    font-size:14px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    padding:9px 6px;
  }
  .reset-btn:hover{ color:var(--ink); }
 
  .count-row{
    margin: 22px 2px 12px;
    font-size:13px;
    color:var(--muted);
  }
  .count-row strong{ color:var(--ink); }
 
  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left;
    font-size:12px;
    font-weight:600;
    color:var(--muted);
    padding:0 14px 8px;
    border-bottom:1px solid var(--border);
  }
  tbody tr{
    background:var(--surface);
    transition: background 0.12s ease;
  }
  tbody tr:hover{ background: var(--accent-soft); }
  tbody td{
    padding:13px 14px;
    font-size:14.5px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  .cedula{ font-variant-numeric: tabular-nums; color:var(--muted); }
  .nombre{ font-weight:500; }
  .sede{ color:var(--muted); }
  .flag-pill{
    display:inline-block;
    margin-left:8px;
    font-size:11px;
    font-weight:600;
    color:var(--flag);
    background:var(--flag-soft);
    padding:2px 8px;
    border-radius:20px;
  }
  .ver-btn{
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:500;
    color:var(--accent);
    background:var(--accent-soft);
    border:none;
    padding:7px 14px;
    border-radius:7px;
    cursor:pointer;
  }
  .ver-btn:hover{ background:#D5E9E7; }
 
  .acciones{ display:flex; gap:6px; }
  .descargar-btn{
    display:inline-block;
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:500;
    color:var(--muted);
    background:var(--bg);
    border:1px solid var(--border);
    padding:6px 13px;
    border-radius:7px;
    cursor:pointer;
    text-decoration:none;
  }
  .descargar-btn:hover{ background:var(--surface); color:var(--ink); }
 
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:15px;
  }
 
  .toast{
    position:fixed;
    left:50%;
    bottom:28px;
    transform: translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    font-size:13.5px;
    padding:12px 18px;
    border-radius:9px;
    opacity:0;
    transition: opacity 0.2s ease, transform 0.2s ease;
    pointer-events:none;
    max-width: 90%;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
 
  @media (max-width: 600px){
    thead th:nth-child(3), tbody td:nth-child(3){ display:none; }
    h1{ font-size:26px; }
  }
</style>
</head>
<body>
<div class="wrap">
 
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M6 3H15L19 7V21H6V3Z" stroke="#1F6F6B" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M15 3V7H19" stroke="#1F6F6B" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 12.5H16M9 15.5H16" stroke="#1F6F6B" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <div class="brand-text"><strong>Actas digitalizadas</strong> · Ciberseguridad</div>
    </div>
  </header>
 
  <h1>Busca un acta por cédula, nombre o sede</h1>
 
  <div class="search-zone">
    <div class="search-input-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
        <circle cx="11" cy="11" r="7" stroke="#8A9A9E" stroke-width="1.8"/>
        <path d="M20 20L16.5 16.5" stroke="#8A9A9E" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Escribe una cédula, un nombre o parte de él…" autocomplete="off">
    </div>
    <div class="filter-row">
      <select id="sedeFilter">
        <option value="">Todas las sedes</option>
      </select>
      <button class="reset-btn" id="resetBtn">Limpiar filtros</button>
    </div>
  </div>
 
  <div class="count-row" id="countRow"></div>
 
  <div id="resultsArea"></div>
 
</div>
 
<div class="toast" id="toast"></div>
 
<script src="data.js"></script>
<script>
  const searchInput = document.getElementById('searchInput');
  const sedeFilter = document.getElementById('sedeFilter');
  const resetBtn = document.getElementById('resetBtn');
  const resultsArea = document.getElementById('resultsArea');
  const countRow = document.getElementById('countRow');
  const toast = document.getElementById('toast');
 
  // Poblar el filtro de sedes a partir de los datos
  const sedes = [...new Set(ACTAS.map(a => a.sede))].sort();
  sedes.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sedeFilter.appendChild(opt);
  });
 
  function normalizar(txt){
    return txt.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }
 
  function nombreDescarga(cedula, nombre){
    const limpio = (nombre || '').replace(/[\\/:*?"<>|]/g, '').trim().replace(/\s+/g, '_');
    return `${cedula}_${limpio}.pdf`;
  }
 
  function render(){
    const q = normalizar(searchInput.value.trim());
    const sedeSel = sedeFilter.value;
 
    const filtradas = ACTAS.filter(a => {
      const coincideTexto = !q || normalizar(a.nombre).includes(q) || a.cedula.includes(q);
      const coincideSede = !sedeSel || a.sede === sedeSel;
      return coincideTexto && coincideSede;
    });
 
    countRow.innerHTML = `<strong>${filtradas.length}</strong> acta${filtradas.length === 1 ? '' : 's'} encontrada${filtradas.length === 1 ? '' : 's'}`;
 
    if (filtradas.length === 0){
      resultsArea.innerHTML = `<div class="empty">No encontramos ninguna acta con eso.<br>Revisa que la cédula o el nombre estén bien escritos.</div>`;
      return;
    }
 
    const filas = filtradas.map(a => `
      <tr>
        <td class="cedula">${a.cedula}</td>
        <td class="nombre">${a.nombre}</td>        <td class="sede">${a.sede}</td>
        <td>
          <div class="acciones">
            <button class="ver-btn" data-archivo="${a.archivo}">Ver PDF</button>
            <a class="descargar-btn" href="${a.archivo}" download="${nombreDescarga(a.cedula, a.nombre)}">Descargar</a>
          </div>
        </td>
      </tr>
    `).join('');
 
    resultsArea.innerHTML = `
      <table>
        <thead>
          <tr><th>Cédula</th><th>Nombre</th><th>Sede</th><th></th></tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>
    `;
 
    resultsArea.querySelectorAll('.ver-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const archivo = btn.getAttribute('data-archivo');
        // Funciona si este HTML vive en la misma carpeta que
        // actas_organizadas/ (es decir, en la raíz del proyecto).
        const ventana = window.open(archivo, '_blank');
        if (!ventana) {
          mostrarToast('El navegador bloqueó la ventana emergente. Habilita popups para este archivo, o ábrelo manualmente desde la carpeta.');
        }
      });
    });
  }
 
  let toastTimer;
  function mostrarToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
  }
 
  searchInput.addEventListener('input', render);
  sedeFilter.addEventListener('change', render);
  resetBtn.addEventListener('click', () => {
    searchInput.value = '';
    sedeFilter.value = '';
    render();
  });
 
  render();
</script>
</body>
</html>
